site_name: PyPI Docs
docs_dir: user
site_dir: user-site
plugins:
  - search
  - material-plausible
  - macros:
      module_name: user/main
      j2_block_start_string: "<!--[[%"
      j2_block_end_string: "%]]-->"
      j2_variable_start_string: "<!--[["
      j2_variable_end_string: "]]-->"
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
      slugify:
        !!python/object/apply:pymdownx.slugs.slugify { kwds: { case: lower } }
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.magiclink:
      repo_url_shorthand: true
      normalize_issue_symbols: true
      provider: github
      user: pypi
      repo: warehouse
theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.ico
  homepage: https://pypi.org
  features:
    - content.action.edit
  palette:
    - scheme: default
      media: "(prefers-color-scheme: light)"
      toggle:
        icon: material/weather-night
        name: Switch to Dark mode
    - scheme: slate
      media: "(prefers-color-scheme: dark)"
      toggle:
        icon: material/weather-sunny
        name: Switch to Light mode
extra_css:
  - stylesheets/extra.css
extra:
  analytics:
    provider: plausible
    domain: docs.pypi.org
    src: https://analytics.python.org/js/script.outbound-links.js
  homepage: https://pypi.org
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pypi
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/pypi
    - icon: fontawesome/brands/mastodon
      link: https://fosstodon.org/@pypi
    - icon: fontawesome/brands/bluesky
      link: https://bsky.app/profile/pypi.org
repo_url: https://github.com/pypi/warehouse
edit_uri: blob/main/docs/user/

