site_name: PyPI User Documentation
docs_dir: user
exclude_docs:
  README.md
not_in_nav: |
  # Linked from upload error messages, intentionally not in the nav.
  archives.md
hooks:
  - user/main.py
site_dir: user-site
validation:
  # Links into pymdownx.tabbed tabs (e.g. `#github-actions`) are valid, but
  # MkDocs only knows about heading anchors and reports them as missing.
  anchors: ignore
plugins:
  - search
  - material-plausible
  - redirects:
      redirect_maps:
        "about/pypi-roadmap.md": "index.md"
  - macros:
      module_name: user/main
      j2_block_start_string: "<!--[[%"
      j2_block_end_string: "%]]-->"
      j2_variable_start_string: "<!--[["
      j2_variable_end_string: "]]-->"
markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
      slugify:
        !!python/object/apply:pymdownx.slugs.slugify { kwds: { case: lower } }
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.magiclink:
      repo_url_shorthand: true
      normalize_issue_symbols: true
      provider: github
      user: pypi
      repo: warehouse
theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.ico
  custom_dir: theme
  homepage: https://pypi.org
  features:
    - content.action.edit
    - navigation.footer
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
extra_css:
  - pypi.css
extra_javascript:
  - assets/js/help-redirects.js
extra:
  pypi_site: user-docs
  analytics:
    provider: plausible
    domain: docs.pypi.org
    src: https://analytics.python.org/js/script.outbound-links.js
  homepage: https://pypi.org
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pypi
    - icon: fontawesome/brands/discourse
      link: https://discuss.python.org/c/packaging/14
    - icon: fontawesome/brands/mastodon
      link: https://fosstodon.org/@pypi
    - icon: fontawesome/brands/bluesky
      link: https://bsky.app/profile/pypi.org
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/pypi
repo_url: https://github.com/pypi/warehouse
edit_uri: blob/main/docs/user/

