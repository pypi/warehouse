version: 2

updates:
- package-ecosystem: pip
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 99
  allow:
  # Only the ~137 packages named in requirements/*.in. Checking the ~293
  # packages in the compiled requirements/*.txt makes the grouped job too slow
  # to finish, and transitive pins move anyway when pip-compile reruns.
  - dependency-type: direct
  rebase-strategy: "disabled"
  ignore:
  # These update basically every day, and 99.9% of the time we don't care
  - dependency-name: "boto3"
  - dependency-name: "boto3-stubs"
  - dependency-name: "botocore"
  - dependency-name: "botocore-stubs"
  groups:
    celery:
      # Keep both celery and kombu together
      patterns:
        - "celery"
        - "kombu"
    psycopg:
      # Keep both psycopg and psycopg-c together
      patterns:
        - "psycopg*"
    python-packages:
      # Group all remaining packages together
      patterns:
        - "*"
  cooldown:
    default-days: 7
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: "daily"
  groups:
    codeql-actions:
      patterns:
        - "github/codeql-action/*"
  cooldown:
    default-days: 7
- package-ecosystem: docker
  directory: "/"
  schedule:
    interval: "daily"
  cooldown:
    default-days: 7
