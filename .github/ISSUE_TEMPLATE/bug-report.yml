name: Bug report
description: Something is broken on pypi.org, test.pypi.org, or files.pythonhosted.org
labels: ["bug :bug:", "requires triaging"]
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > **Need help with your account, a project, or reaching PyPI?**
        > Open a request in [pypi/support](https://github.com/pypi/support/issues/new/choose) instead.
        > That covers account recovery, 2FA, network or connection errors,
        > rate limits (HTTP 429), limit increases, organizations, and name retention requests.

        This form is for bugs in PyPI itself. Before reporting:

        - For a problem with a package you installed, contact that project's maintainers.
        - If a new or updated project is missing from search, wait a few hours. The search index takes time to update.
        - For python.org or docs.python.org, report to [python/pythondotorg](https://github.com/python/pythondotorg/issues).
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: This is a bug in PyPI itself, not a support request or a problem with a specific package.
          required: true
        - label: I searched existing issues and found no duplicate.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the bug, or a link to the PyPI page where it shows.
    validations:
      required: true
  - type: textarea
    id: platform
    attributes:
      label: Your platform
      description: Browser, version, and OS. For a command-line tool, the tool and its version.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, links, or anything else that helps.
