name: Feature request
description: Suggest a new feature or improvement for PyPI
labels: ["feature request", "requires triaging"]
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > Requests for limit increases, organizations, or name retention requests go to
        > [pypi/support](https://github.com/pypi/support/issues/new/choose), not here.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Alternatives you considered, links, or anything else that helps.
